<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
(() => {
"use strict";
const CONFIG = window.PULSE_CONFIG || { url:"", key:"" };
const LEGACY_CONFIG_KEY = "pulse-supabase-config-v4";
const LOCAL_CACHE = "pulse-commercial-cache-v1";
const LOCAL_PREFS = "pulse-commercial-prefs-v1";
let sb=null, session=null, profile=null, state={expenses:[],categories:[],payments:[],payers:[],budgets:[],recurring:[]};
let editingId=null;


const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const uid=()=>crypto.randomUUID();
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function getStoredConfig(){try{return JSON.parse(localStorage.getItem(LEGACY_CONFIG_KEY)||"null")}catch{return null}}
function getConfig(){if(CONFIG.url&&CONFIG.key)return CONFIG;const x=getStoredConfig();return x&&x.url&&x.key?x:{url:"",key:""}}
function cache(){localStorage.setItem(LOCAL_CACHE,JSON.stringify(state))}
function loadCache(){try{const x=JSON.parse(localStorage.getItem(LOCAL_CACHE)||"null");if(x){state={...state,...x}}}catch{}}
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}
function setView(name){document.querySelectorAll("[data-view]").forEach(x=>x.hidden=x.dataset.view!==name);document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===name))}
function monthKey(d){return d.slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function fmtMonth(m){return new Date(m+"-02").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}

function authScreen(message=""){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse</h2><p>Smart expense tracking, private by design.</p>
 <div class="note">Your expenses are protected by Supabase Auth + PostgreSQL Row Level Security. Each account sees only its own data.</div>
 <div class="form">
  <div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
  <div class="field full"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
 </div>
 <div class="modalFoot"><button id="loginBtn" class="btn primary">Sign in</button><button id="signupBtn" class="btn">Create account</button></div>
 <div id="authMsg" style="color:#94a3b8;margin-top:12px">${esc(message)}</div>
 </div></div>`;
 $("loginBtn").onclick=login; $("signupBtn").onclick=signup;
}

function configScreen(){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse setup</h2><p>One-time deployment configuration.</p>
 <div class="note">For the commercial build, put your <b>sb_publishable_...</b> key in <code>config.js</code>. Never put a secret/service-role key here.</div>
 <div class="form"><div class="field full"><label>Supabase Project URL</label><input id="setupUrl" placeholder="https://your-project.supabase.co"></div><div class="field full"><label>Publishable key</label><input id="setupKey" placeholder="sb_publishable_..."></div></div>
 <div class="modalFoot"><button id="saveSetup" class="btn primary">Connect Pulse</button></div>
 </div></div>`;
 $("saveSetup").onclick=async()=>{const url=$("setupUrl").value.trim().replace(/\/+$/,""),key=$("setupKey").value.trim();if(!/^https:\/\/[a-z0-9-]+\\.supabase\\.co(m)?$/i.test(url)||!key.startsWith("sb_publishable_")){alert("Enter a valid Supabase URL and sb_publishable_ key.");return}localStorage.setItem(LEGACY_CONFIG_KEY,JSON.stringify({url,key}));location.reload()};
}

async function initClient(){
 const c=getConfig();
 if(!c.url||!c.key){configScreen();return false}
 if(!window.supabase){alert("Supabase library failed to load. Check your internet connection.");return false}
 sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await sb.auth.getSession();
 if(error){authScreen(error.message);return false}
 session=data.session;
 sb.auth.onAuthStateChange((_e,s)=>{session=s; if(s) loadAll();});
 if(!session){authScreen();return false}
 await loadAll();return true;
}

async function login(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||!p){$("authMsg").textContent="Enter email and password.";return}
 const r=await sb.auth.signInWithPassword({email:e,password:p});
 $("authMsg").textContent=r.error?r.error.message:"Signed in.";
}
async function signup(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||p.length<8){$("authMsg").textContent="Use a valid email and a password of at least 8 characters.";return}
 const r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
 $("authMsg").textContent=r.error?r.error.message:(r.data.session?"Account created.":"Account created. Check your email if confirmation is required.");
}

async function loadAll(){
 if(!session)return;
 const uid=session.user.id;
 const [p,c,pm,py,b,r,e]=await Promise.all([
  sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
  sb.from("categories").select("*").eq("user_id",uid).order("name"),
  sb.from("payment_methods").select("*").eq("user_id",uid).order("name"),
  sb.from("payers").select("*").eq("user_id",uid).order("name"),
  sb.from("budgets").select("*").eq("user_id",uid).order("month",{ascending:false}),
  sb.from("recurring_expenses").select("*").eq("user_id",uid).order("next_date"),
  sb.from("expenses").select("*").eq("user_id",uid).order("date",{ascending:false}).order("created_at",{ascending:false})
 ]);
 const bad=[p,c,pm,py,b,r,e].find(x=>x.error);
 if(bad){console.error(bad.error);toast("Cloud load error: "+bad.error.message);return}
 profile=p.data||{id:uid,display_name:session.user.email.split("@")[0],currency:"INR"};
 state.categories=(c.data||[]).map(x=>({id:x.id,name:x.name,icon:x.icon||"•"}));
 state.payments=(pm.data||[]).map(x=>({id:x.id,name:x.name}));
 state.payers=(py.data||[]).map(x=>({id:x.id,name:x.name}));
 state.budgets=b.data||[];state.recurring=r.data||[];
 state.expenses=(e.data||[]).map(x=>({id:x.id,date:x.date,detail:x.detail,type:x.type,amount:Number(x.amount),paidvia:x.paid_via,paidby:x.paid_by,notes:x.notes||""}));
 cache();renderApp();
}

function appShell(){
 document.body.innerHTML=`<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Pulse</h1><p>Smart expense command center</p></div></div>
<div class="actions"><span id="syncBadge" class="badge">☁ Synced</span><button class="btn desktop" id="profileBtn">👤 <span id="userName">Account</span></button><button class="btn desktop" id="settingsBtn">⚙ Settings</button><button class="btn primary" id="addBtn">＋ Add expense</button></div></header>

<section data-view="home"><div class="hero"><div class="heroGrid"><div><div class="eyebrow">PULSE OVERVIEW</div><h2 id="greeting">Good day 👋</h2><p>Track today. Understand this month. Stay in control.</p><div id="quickActions" class="quick"></div></div><div><div class="label">This month</div><div id="total" class="heroTotal">₹0</div><div id="delta" class="delta">0 transactions</div></div></div>
<div class="filters"><select id="monthFilter" class="control"></select><select id="catFilter" class="control"></select><select id="payFilter" class="control"></select><input id="search" class="control" placeholder="Search expenses…"><button id="resetBtn" class="btn">Reset</button></div><div id="setupBanner" class="note" style="display:none;margin-top:14px"></div></div>

<div class="stats"><div class="card stat"><div class="label">Transactions</div><div id="count" class="num">0</div><div class="sub">selected view</div></div><div class="card stat"><div class="label">Average</div><div id="avg" class="num">₹0</div><div class="sub">per transaction</div></div><div class="card stat"><div class="label">Largest</div><div id="largest" class="num">₹0</div><div class="sub">single expense</div></div><div class="card stat"><div class="label">Top category</div><div id="topCat" class="num">—</div><div class="sub" id="topCatAmt">₹0</div></div></div>

<div class="grid2"><div class="card cardPad"><h3>Spending pulse</h3><div id="chart" class="chart"></div></div><div class="card cardPad"><h3>Category breakdown</h3><div id="cats" class="cats"></div></div></div>
<div class="grid2" style="margin-top:15px"><div class="card cardPad"><h3>Budget health</h3><div id="budgetHealth"></div></div><div class="card cardPad"><h3>Pulse insights</h3><div id="insights" class="insights"></div></div></div>

<div class="card tableCard"><div class="tableHead"><div><h3 style="margin:0">Recent expenses</h3><small id="shown" style="color:#94a3b8"></small></div><div class="actions"><button id="importBtn" class="btn desktop">Import CSV</button><button id="exportBtn" class="btn desktop">Export</button><button id="deleteAllBtn" class="btn danger desktop">Delete all</button><input id="fileInput" type="file" accept=".csv" hidden></div></div><div class="tableWrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Amount</th><th>Paid via</th><th>Paid by</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</section>

<section data-view="budgets" hidden><div class="hero"><div class="eyebrow">BUDGETS</div><h2>Give every rupee a job.</h2><p>Set monthly limits and see how much is left.</p><button id="addBudgetBtn" class="btn primary">＋ Add budget</button></div><div id="budgetGrid" class="budgetGrid" style="margin-top:15px"></div></section>

<section data-view="expenses" hidden><div class="card cardPad"><h3>All expenses</h3><div class="filters"><input id="expenseSearch" class="control" placeholder="Search…"><button id="exportBtn2" class="btn">Export CSV</button><button id="importBtn2" class="btn">Import CSV</button></div><div class="tableWrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Amount</th><th>Paid via</th><th>Paid by</th><th></th></tr></thead><tbody id="tbody2"></tbody></table></div></div></section>

<section data-view="more" hidden><div class="card cardPad"><h3>Account & settings</h3><div class="note">Signed in as <b id="accountEmail"></b>. Your data is isolated by PostgreSQL RLS using your authenticated user ID.</div><div class="list"><button class="btn" id="templatesBtn">⚙ Manage templates</button><button class="btn" id="profileBtn2">👤 Profile</button><button class="btn" id="securityBtn">🔐 Security</button><button class="btn danger" id="logoutBtn">Sign out</button></div></div></section>

<nav class="bottomNav"><button data-nav="home" class="active">⌂<br>Home</button><button data-nav="expenses">▤<br>Expenses</button><button data-nav="budgets">◉<br>Budgets</button><button data-nav="more">•••<br>More</button></nav>
</div>

<div id="expenseModal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="expenseTitle">Add expense</h2><button class="close" data-close="expenseModal">×</button></div><div class="form"><div class="field"><label>Date</label><input id="fdate" type="date"></div><div class="field"><label>Amount</label><input id="famount" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field full"><label>Expense detail</label><input id="fdetail" placeholder="What did you spend on?"></div><div class="field"><label>Category</label><select id="ftype"></select></div><div class="field"><label>Paid via</label><select id="fvia"></select></div><div class="field"><label>Paid by</label><select id="fby"></select></div><div class="field full"><label>Notes (optional)</label><textarea id="fnotes" placeholder="Optional note"></textarea></div></div><div class="modalFoot"><button class="btn" data-close="expenseModal">Cancel</button><button id="saveExpense" class="btn primary">Save expense</button></div></div></div>

<div id="templatesModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>Template Studio</h2><button class="close" data-close="templatesModal">×</button></div><div class="navTabs"><button class="tab active" data-tpltab="categories">Categories</button><button class="tab" data-tpltab="payments">Payment methods</button><button class="tab" data-tpltab="payers">Paid by</button></div><div id="tplContent"></div></div></div>

<div id="budgetModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>Add monthly budget</h2><button class="close" data-close="budgetModal">×</button></div><div class="form"><div class="field"><label>Month</label><input id="bmonth" type="month"></div><div class="field"><label>Amount</label><input id="bamount" type="number" min="0" step="0.01"></div><div class="field full"><label>Category (optional)</label><select id="bcat"><option value="">Overall budget</option></select></div></div><div class="modalFoot"><button class="btn" data-close="budgetModal">Cancel</button><button id="saveBudget" class="btn primary">Save budget</button></div></div></div>

<div id="profileModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>Your profile</h2><button class="close" data-close="profileModal">×</button></div><div class="form"><div class="field"><label>Display name</label><input id="pname"></div><div class="field"><label>Currency</label><select id="pcurrency"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>SGD</option><option>AED</option></select></div></div><div class="modalFoot"><button class="btn" data-close="profileModal">Cancel</button><button id="saveProfile" class="btn primary">Save</button></div></div></div>

<div id="securityModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>Security</h2><button class="close" data-close="securityModal">×</button></div><div class="note">Pulse uses Supabase Auth and database-level Row Level Security. Never enter a service-role or secret key into Pulse.</div><div class="list"><div class="listRow"><div><b>Account</b><small id="securityEmail"></small></div><span class="badge">Authenticated</span></div><div class="listRow"><div><b>Database isolation</b><small>Rows are restricted by your authenticated user ID.</small></div><span class="badge">RLS</span></div></div><p style="color:#94a3b8;font-size:12px">For production, enable MFA in Supabase Auth and consider requiring MFA for sensitive accounts. Pulse does not store your password.</p></div></div>

<div id="settingsModal" class="modal"><div class="modalBox"><div class="modalHead"><h2>Settings</h2><button class="close" data-close="settingsModal">×</button></div><div class="note">Cloud configuration is part of the deployed app. Only the publishable key belongs in browser code.</div><div class="list"><button id="templatesBtn2" class="btn">⚙ Manage templates</button><button id="profileBtn3" class="btn">👤 Profile</button><button id="securityBtn2" class="btn">🔐 Security</button></div></div></div>
`;

 $("userName").textContent=profile?.display_name||session.user.email.split("@")[0];$("accountEmail").textContent=session.user.email;$("securityEmail").textContent=session.user.email;
 bindApp();
}

function bindApp(){
 document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
 document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>setView(b.dataset.nav));
 $("addBtn").onclick=()=>openExpense();$("templatesBtn").onclick=openTemplates;$("templatesBtn2").onclick=openTemplates;
 $("profileBtn").onclick=openProfile;$("profileBtn2").onclick=openProfile;$("profileBtn3").onclick=openProfile;
 $("securityBtn").onclick=()=>openModal("securityModal");$("securityBtn2").onclick=()=>openModal("securityModal");
 $("settingsBtn").onclick=()=>openModal("settingsModal");$("logoutBtn").onclick=logout;
 $("saveExpense").onclick=saveExpense;$("addBudgetBtn").onclick=()=>openBudget();$("saveBudget").onclick=saveBudget;
 $("saveProfile").onclick=saveProfile;
 ["monthFilter","catFilter","payFilter","search"].forEach(id=>$(id).addEventListener("input",renderHome));
 $("resetBtn").onclick=()=>{["monthFilter","catFilter","payFilter","search"].forEach(id=>$(id).value="");renderHome()};
 $("deleteAllBtn").onclick=deleteAll;$("exportBtn").onclick=exportCSV;$("exportBtn2").onclick=exportCSV;
 $("importBtn").onclick=()=>$("fileInput").click();$("importBtn2").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>importCSV(e.target.files[0]);
 $("expenseSearch").oninput=renderExpenseList;
 document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>openExpense(null,b.dataset.quick));
 $("tbody").onclick=rowActions;$("tbody2").onclick=rowActions;
 document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
}

function populateExpenseForm(){
 $("ftype").innerHTML=state.categories.length?state.categories.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join(""):`<option value="">Set up categories first</option>`;
 $("fvia").innerHTML=state.payments.length?state.payments.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join(""):`<option value="">Set up payment methods first</option>`;
 $("fby").innerHTML=state.payers.length?state.payers.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join(""):`<option value="">Set up Paid by first</option>`;
}
function openExpense(id=null,quickCat=""){
 if(!state.categories.length||!state.payments.length||!state.payers.length){
   openTemplates();
   toast("Set up your categories, payment methods and Paid by options first.");
   return;
 }
 editingId=id;populateExpenseForm();const x=id?state.expenses.find(e=>e.id===id):null;
 $("expenseTitle").textContent=x?"Edit expense":"Add expense";$("fdate").value=x?.date||new Date().toISOString().slice(0,10);$("famount").value=x?.amount||"";$("fdetail").value=x?.detail||"";$("fnotes").value=x?.notes||"";
 $("ftype").value=x?.type||quickCat||state.categories[0]?.name||"";$("fvia").value=x?.paidvia||state.payments[0]?.name||"";$("fby").value=x?.paidby||state.payers[0]?.name||"";openModal("expenseModal");
}
async function saveExpense(){
 const x={date:$("fdate").value,amount:Number($("famount").value),detail:$("fdetail").value.trim(),type:$("ftype").value,paidvia:$("fvia").value,paidby:$("fby").value,notes:$("fnotes").value.trim()};
 if(!x.date||!x.detail||!x.amount||!x.type||!x.paidvia||!x.paidby){alert("Complete date, amount, detail, category, payment method and paid by.");return}
 let r;
 if(editingId)r=await sb.from("expenses").update({date:x.date,detail:x.detail,type:x.type,amount:x.amount,paid_via:x.paidvia,paid_by:x.paidby,notes:x.notes}).eq("id",editingId).eq("user_id",session.user.id).select().single();
 else r=await sb.from("expenses").insert({user_id:session.user.id,date:x.date,detail:x.detail,type:x.type,amount:x.amount,paid_via:x.paidvia,paid_by:x.paidby,notes:x.notes}).select().single();
 if(r.error){alert(r.error.message);return}
 const mapped={id:r.data.id,date:r.data.date,detail:r.data.detail,type:r.data.type,amount:Number(r.data.amount),paidvia:r.data.paid_via,paidby:r.data.paid_by,notes:r.data.notes||""};
 if(editingId)state.expenses=state.expenses.map(e=>e.id===editingId?mapped:e);else state.expenses.unshift(mapped);
 cache();renderHome();renderExpenseList();closeModal("expenseModal");toast(editingId?"Expense updated":"Expense added");editingId=null;
}
async function rowActions(e){
 const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;
 if(e.target.dataset.edit)openExpense(id);else await deleteExpense(id);
}
async function deleteExpense(id){
 const x=state.expenses.find(e=>e.id===id);if(!x||!confirm(`Delete ${x.detail} — ${money(x.amount)}?`))return;
 const r=await sb.from("expenses").delete().eq("id",id).eq("user_id",session.user.id);if(r.error){alert(r.error.message);return}
 state.expenses=state.expenses.filter(e=>e.id!==id);cache();renderHome();renderExpenseList();toast("Expense deleted");
}
async function deleteAll(){
 if(!state.expenses.length||!confirm(`Delete all ${state.expenses.length} expenses? This cannot be undone.`))return;
 const r=await sb.from("expenses").delete().eq("user_id",session.user.id);if(r.error){alert(r.error.message);return}
 state.expenses=[];cache();renderHome();renderExpenseList();toast("All expenses deleted");
}

function filteredExpenses(){
 const m=$("monthFilter")?.value||"",c=$("catFilter")?.value||"",p=$("payFilter")?.value||"",q=($("search")?.value||"").toLowerCase().trim();
 return state.expenses.filter(x=>(!m||monthKey(x.date)===m)&&(!c||x.type===c)&&(!p||x.paidvia===p)&&(!q||[x.detail,x.type,x.paidvia,x.paidby,x.notes].join(" ").toLowerCase().includes(q)));
}
function renderFilters(){
 const months=[...new Set(state.expenses.map(x=>monthKey(x.date)))].sort().reverse(),m=$("monthFilter").value,c=$("catFilter").value,p=$("payFilter").value;
 $("monthFilter").innerHTML='<option value="">This month</option>'+months.map(x=>`<option value="${x}">${fmtMonth(x)}</option>`).join("");
 $("catFilter").innerHTML='<option value="">All categories</option>'+state.categories.map(x=>`<option>${esc(x.name)}</option>`).join("");
 $("payFilter").innerHTML='<option value="">All payment methods</option>'+state.payments.map(x=>`<option>${esc(x.name)}</option>`).join("");
 if(months.includes(m))$("monthFilter").value=m;else $("monthFilter").value=currentMonth();
 if(state.categories.some(x=>x.name===c))$("catFilter").value=c;if(state.payments.some(x=>x.name===p))$("payFilter").value=p;
}
function renderQuickActions(){
 const el=$("quickActions");if(!el)return;
 const top=state.categories.slice(0,3);
 el.innerHTML=[`<button data-quick="">＋ Quick expense</button>`,...top.map(x=>`<button data-quick="${esc(x.name)}">${esc(x.icon||"•")} ${esc(x.name)}</button>`)].join("");
 el.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>openExpense(null,b.dataset.quick||""));
}
function renderSetupBanner(){
 const el=$("setupBanner");if(!el)return;
 const missing=[];if(!state.categories.length)missing.push("categories");if(!state.payments.length)missing.push("payment methods");if(!state.payers.length)missing.push("Paid by options");
 if(!missing.length){el.style.display="none";el.innerHTML="";return;}
 el.style.display="block";el.innerHTML=`<b>Finish your Pulse setup</b><br><span style="color:#bae6fd">No personal defaults are preloaded. Add your own ${esc(missing.join(", "))} before recording expenses.</span><br><button class="btn" style="margin-top:9px" id="setupNow">⚙ Set up my options</button>`;$("setupNow").onclick=openTemplates;
}
function renderHome(){
 if(!$("total"))return;renderFilters();renderQuickActions();renderSetupBanner();const a=filteredExpenses();const total=a.reduce((s,x)=>s+x.amount,0);$("total").textContent=money(total);$("count").textContent=a.length;$("avg").textContent=money(a.length?total/a.length:0);
 const largest=a.reduce((m,x)=>!m||x.amount>m.amount?x:m,null);$("largest").textContent=money(largest?.amount||0);
 const cm={};a.forEach(x=>cm[x.type]=(cm[x.type]||0)+x.amount);const top=Object.entries(cm).sort((a,b)=>b[1]-a[1])[0];$("topCat").textContent=top?.[0]||"—";$("topCatAmt").textContent=money(top?.[1]||0);$("delta").textContent=`${a.length} transaction${a.length===1?"":"s"} in selected view`;
 renderChart(a);renderCats(cm);renderBudgetHealth();renderInsights(a,cm);renderTable(a);$("shown").textContent=`Showing ${a.length} of ${state.expenses.length}`;renderBudgetGrid();
}
function renderChart(a){const map={};a.forEach(x=>map[x.date]=(map[x.date]||0)+x.amount);const days=Object.keys(map).sort(),max=Math.max(...days.map(d=>map[d]),1);$("chart").innerHTML=days.length?days.slice(-31).map(d=>`<div class="barCol" title="${esc(d)} ${money(map[d])}"><div class="bar" style="height:${Math.max(2,map[d]/max*100)}%"></div><span>${d.slice(8)}</span></div>`).join(""):'<div class="empty" style="width:100%">No spending yet</div>'}
function renderCats(cm){const rows=Object.entries(cm).sort((a,b)=>b[1]-a[1]).slice(0,7),max=rows[0]?.[1]||1;$("cats").innerHTML=rows.length?rows.map(([k,v])=>`<div class="cat"><div>${esc(k)}<div class="line"><div class="fill" style="width:${v/max*100}%"></div></div></div><strong>${money(v)}</strong></div>`).join(""):'<div class="empty">No categories</div>'}
function renderTable(a){const rows=[...a].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,100);$("tbody").innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.date)}</td><td><b>${esc(x.detail)}</b></td><td><span class="pill">${esc(x.type)}</span></td><td class="amount">${money(x.amount)}</td><td>${esc(x.paidvia)}</td><td>${esc(x.paidby)}</td><td><button class="rowbtn" data-edit="${x.id}">Edit</button><button class="rowbtn del" data-del="${x.id}">Delete</button></td></tr>`).join(""):'<tr><td colspan="7" class="empty">No expenses found.</td></tr>'}
function renderExpenseList(){if(!$("tbody2"))return;const q=($("expenseSearch")?.value||"").toLowerCase();const a=state.expenses.filter(x=>[x.detail,x.type,x.paidvia,x.paidby,x.notes].join(" ").toLowerCase().includes(q)).sort((x,y)=>y.date.localeCompare(x.date));$("tbody2").innerHTML=a.length?a.map(x=>`<tr><td>${esc(x.date)}</td><td><b>${esc(x.detail)}</b></td><td>${esc(x.type)}</td><td class="amount">${money(x.amount)}</td><td>${esc(x.paidvia)}</td><td>${esc(x.paidby)}</td><td><button class="rowbtn" data-edit="${x.id}">Edit</button><button class="rowbtn del" data-del="${x.id}">Delete</button></td></tr>`).join(""):'<tr><td colspan="7" class="empty">No expenses found.</td></tr>'}
function renderInsights(a,cm){const items=[];const thisM=currentMonth();const mTotal=state.expenses.filter(x=>monthKey(x.date)===thisM).reduce((s,x)=>s+x.amount,0);const last=new Date();last.setMonth(last.getMonth()-1);const lm=last.toISOString().slice(0,7);const lTotal=state.expenses.filter(x=>monthKey(x.date)===lm).reduce((s,x)=>s+x.amount,0);if(lTotal){const pct=(mTotal-lTotal)/lTotal*100;items.push(`<div class="insight"><strong>${pct>=0?"📈":"📉"} ${Math.abs(pct).toFixed(1)}% ${pct>=0?"higher":"lower"} than last month</strong><small>${money(mTotal)} this month vs ${money(lTotal)} last month.</small></div>`)}else items.push(`<div class="insight"><strong>✨ Build your first baseline</strong><small>Keep logging expenses and Pulse will compare your spending over time.</small></div>`);const top=Object.entries(cm).sort((a,b)=>b[1]-a[1])[0];if(top)items.push(`<div class="insight"><strong>🎯 ${esc(top[0])} is your top category</strong><small>${money(top[1])} in the selected view.</small></div>`);$("insights").innerHTML=items.join("")}
function renderBudgetHealth(){const m=currentMonth(),overall=state.budgets.find(b=>b.month===m&&!b.category_id);const spent=state.expenses.filter(x=>monthKey(x.date)===m).reduce((s,x)=>s+x.amount,0);if(!overall){$("budgetHealth").innerHTML='<div class="empty">No overall budget for this month.<br><button class="btn primary" style="margin-top:10px" id="quickBudget">Set one</button></div>';setTimeout(()=>{$("quickBudget")?.addEventListener("click",()=>openBudget())},0);return}const pct=Math.min(100,spent/Number(overall.amount)*100);$("budgetHealth").innerHTML=`<div class="budgetTop"><strong>${money(spent)} spent</strong><strong>${money(overall.amount)}</strong></div><div class="progress"><div style="width:${pct}%"></div></div><p style="color:#94a3b8;font-size:12px">${money(Math.max(0,Number(overall.amount)-spent))} remaining • ${pct.toFixed(0)}% used</p>`}
function renderBudgetGrid(){if(!$("budgetGrid"))return;const m=currentMonth();$("budgetGrid").innerHTML=state.budgets.length?state.budgets.map(b=>{const spent=state.expenses.filter(x=>monthKey(x.date)===b.month&&(!b.category_id||x.type===b.category_name)).reduce((s,x)=>s+x.amount,0);const pct=Math.min(100,spent/Number(b.amount)*100);return `<div class="card budget"><div class="budgetTop"><strong>${esc(b.category_name||"Overall")}</strong><strong>${money(b.amount)}</strong></div><small style="color:#94a3b8">${fmtMonth(b.month)} • ${money(spent)} spent</small><div class="progress"><div style="width:${pct}%"></div></div><div style="margin-top:8px;color:#94a3b8;font-size:11px">${money(Math.max(0,Number(b.amount)-spent))} remaining</div></div>`}).join(""):'<div class="card cardPad" style="grid-column:1/-1"><div class="empty">No budgets yet. Add your first monthly budget.</div></div>'}
async function openBudget(){ $("bmonth").value=currentMonth();$("bamount").value="";$("bcat").innerHTML='<option value="">Overall budget</option>'+state.categories.map(x=>`<option value="${x.id}" data-name="${esc(x.name)}">${esc(x.name)}</option>`).join("");openModal("budgetModal")}
async function saveBudget(){const month=$("bmonth").value,amount=Number($("bamount").value),sel=$("bcat").selectedOptions[0],catId=$("bcat").value||null,catName=sel?.dataset.name||null;if(!month||!amount){alert("Enter month and amount.");return}const r=await sb.from("budgets").upsert({user_id:session.user.id,month,amount,category_id:catId,category_name:catName},{onConflict:"user_id,month,category_id"}).select().single();if(r.error){alert(r.error.message);return}state.budgets=state.budgets.filter(b=>!(b.month===month&&b.category_id===catId));state.budgets.push(r.data);cache();renderHome();closeModal("budgetModal");toast("Budget saved")}
function openTemplates(){renderTemplateContent("categories");openModal("templatesModal")}
function renderTemplateContent(kind){
 document.querySelectorAll("[data-tpltab]").forEach(x=>x.classList.toggle("active",x.dataset.tpltab===kind));
 const arr=kind==="categories"?state.categories:kind==="payments"?state.payments:state.payers;
 const label=kind==="categories"?"category":kind==="payments"?"payment method":"person / payer";
 $("tplContent").innerHTML=`<div class="note">These options are private to this Pulse account. Pulse never preloads another user's categories, payment methods or names.</div><div class="list">${arr.map(x=>`<div class="listRow"><div><b>${esc(x.name)}</b></div><button class="rowbtn del" data-tpl-del="${x.id}" data-tpl-kind="${kind}">Delete</button></div>`).join("")}</div><div class="addRow"><input id="tplNew" placeholder="Add ${label}"><button id="tplAdd" class="btn primary">＋ Add</button></div>`;
 $("tplAdd").onclick=()=>addTemplate(kind);
 $("tplContent").onclick=e=>{if(e.target.dataset.tplDel)removeTemplate(kind,e.target.dataset.tplDel)};
}
document.addEventListener("click",e=>{if(e.target.dataset.tpltab)renderTemplateContent(e.target.dataset.tpltab)});
async function addTemplate(kind){
 const name=$("tplNew").value.trim();if(!name)return;
 const table=kind==="categories"?"categories":kind==="payments"?"payment_methods":"payers";
 const payload=kind==="categories"?{user_id:session.user.id,name,icon:"•"}:{user_id:session.user.id,name};
 const r=await sb.from(table).insert(payload).select().single();
 if(r.error){alert(r.error.message);return}
 if(kind==="categories")state.categories.push(r.data);else if(kind==="payments")state.payments.push(r.data);else state.payers.push(r.data);
 cache();populateExpenseForm();renderHome();renderTemplateContent(kind);toast(`${kind==="categories"?"Category":kind==="payments"?"Payment method":"Paid by option"} added`);
}
async function removeTemplate(kind,id){
 if(!confirm("Remove this option? Existing expenses are not changed."))return;
 const table=kind==="categories"?"categories":kind==="payments"?"payment_methods":"payers";
 const r=await sb.from(table).delete().eq("id",id).eq("user_id",session.user.id);
 if(r.error){alert(r.error.message);return}
 if(kind==="categories")state.categories=state.categories.filter(x=>x.id!==id);else if(kind==="payments")state.payments=state.payments.filter(x=>x.id!==id);else state.payers=state.payers.filter(x=>x.id!==id);
 cache();populateExpenseForm();renderHome();renderTemplateContent(kind);
}
async function openProfile(){const r=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();profile=r.data||profile||{};$("pname").value=profile.display_name||"";$("pcurrency").value=profile.currency||"INR";openModal("profileModal")}
async function saveProfile(){const name=$("pname").value.trim();const currency=$("pcurrency").value;const r=await sb.from("profiles").upsert({id:session.user.id,display_name:name,currency},{onConflict:"id"}).select().single();if(r.error){alert(r.error.message);return}profile=r.data;$("userName").textContent=name||session.user.email.split("@")[0];closeModal("profileModal");toast("Profile saved")}
async function logout(){await sb.auth.signOut();location.reload()}

function exportCSV(){const cell=v=>`"${String(v??"").replace(/\r?\n/g," ").replace(/"/g,'""')}"`;const rows=[["Date","Expense Detail","Type of Expense","Amount","Paid via","Paid by","Notes"],...state.expenses.map(x=>[x.date,x.detail,x.type,x.amount,x.paidvia,x.paidby,x.notes])];const csv="\uFEFF"+rows.map(r=>r.map(cell).join(",")).join("\r\n")+"\r\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Pulse_Expenses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importCSV(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=async ev=>{
  const lines=ev.target.result.split(/\r?\n/).filter(Boolean);
  const parse=line=>{const a=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'){c+='"';i++;}else if(ch==='"')q=!q;else if(ch===","&&!q){a.push(c);c="";}else c+=ch;}a.push(c);return a};
  const rows=lines.slice(1).map(parse);
  const data=rows.map(r=>({user_id:session.user.id,date:r[0]?.trim(),detail:r[1]?.trim(),type:r[2]?.trim(),amount:Number(r[3]),paid_via:r[4]?.trim(),paid_by:r[5]?.trim(),notes:r[6]?.trim()||""})).filter(x=>x.date&&x.detail&&Number.isFinite(x.amount));
  if(!data.length){alert("No valid rows found.");return}
  if(!confirm(`Import ${data.length} expenses? Missing categories, payment methods and Paid by options will be added only from this file.`))return;
  const uid=session.user.id;
  const catNames=[...new Set(data.map(x=>x.type).filter(Boolean))];const payNames=[...new Set(data.map(x=>x.paid_via).filter(Boolean))];const payerNames=[...new Set(data.map(x=>x.paid_by).filter(Boolean))];
  const missingCats=catNames.filter(n=>!state.categories.some(x=>x.name===n)).map(name=>({user_id:uid,name,icon:"•"}));
  const missingPays=payNames.filter(n=>!state.payments.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  const missingPayers=payerNames.filter(n=>!state.payers.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  if(missingCats.length){const r=await sb.from("categories").insert(missingCats);if(r.error){alert(r.error.message);return}}
  if(missingPays.length){const r=await sb.from("payment_methods").insert(missingPays);if(r.error){alert(r.error.message);return}}
  if(missingPayers.length){const r=await sb.from("payers").insert(missingPayers);if(r.error){alert(r.error.message);return}}
  const r=await sb.from("expenses").insert(data);if(r.error){alert(r.error.message);return}
  await loadAll();toast("Import complete");
 };
 reader.readAsText(file);
}
function renderApp(){appShell();renderHome();renderExpenseList();$("greeting").textContent=`Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"} 👋 ${profile?.display_name?esc(profile.display_name):""}`}

(async()=>{loadCache();const c=getConfig();if(!c.url||!c.key){configScreen();return}await initClient()})();
})();
</script>
